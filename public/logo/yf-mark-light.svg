<svg xmlns="http://www.w3.org/2000/svg"
      width="64" height="64" viewBox="0 0 64 64"
      role="img" aria-labelledby="title">
      <title id="title">YourForce YF mark</title>
      
    <defs>
      <linearGradient id="yf-mark-light-svg-blue" x1="7" y1="7" x2="39" y2="58" gradientUnits="userSpaceOnUse">
        <stop stop-color="#3B82F6"/>
        <stop offset="1" stop-color="#1D4ED8"/>
      </linearGradient>
      <linearGradient id="yf-mark-light-svg-green" x1="42" y1="5" x2="58" y2="15" gradientUnits="userSpaceOnUse">
        <stop stop-color="#22C58B"/>
        <stop offset="1" stop-color="#0E9F6E"/>
      </linearGradient>
    </defs>

    <!-- Geometric Y -->
    <path
      d="M5 8H18L29.5 24.5L40.5 8H54L36.5 33V56H23V33L5 8Z"
      fill="url(#yf-mark-light-svg-blue)"
    />

    <!-- Interlocking F -->
    <path
      d="M31 8H60L56 19H43L40.5 27H53L49 38H37L31 56H17L28 23L31 8Z"
      fill="#0F172A"
    />

    <!-- Green accent -->
    <path
      d="M44 4H60L56 13H40L44 4Z"
      fill="url(#yf-mark-light-svg-green)"
    />
    
    </svg>